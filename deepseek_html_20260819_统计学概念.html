            detail: `
                <p><strong>核心概念：</strong></p>
                <ul style="padding-left:20px; margin:6px 0;">
                    <li><strong>第一类错误 (Type I)：</strong> 原假设为真，但拒绝了它。即“假阳性”，代价是相信了不存在的效应。</li>
                    <li><strong>第二类错误 (Type II)：</strong> 原假设为假，但未能拒绝它。即“假阴性”，代价是错过了真实的效应。</li>
                    <li><strong>权衡：</strong> 降低 α 会减少第一类错误，但可能增加第二类错误。增加样本量可以同时降低两种错误。</li>

                    <li><strong>随机分组：</strong> 将研究对象随机分配到“干预组”（接受处理）和“对照组”（不接受处理）。</li>

                    <li><strong>经典例子：</strong> 用“距离医学院的远近”作为“是否学医”的工具变量，来研究“学医对收入的影响”。</li>

                    <li><strong>关键假设：</strong> 平行趋势——如果没有处理，两组的时间趋势应该平行。</li>

            tag: 'causal',
            tagLabel: '🔬 因果推断',
            title: '倾向得分匹配 (PSM)',
            brief: '在观察性数据中，为处理组找到“最像”的对照组，模拟随机化实验。',
            detail: `
                <p><strong>核心概念：</strong></p>
                <ul style="padding-left:20px; margin:6px 0;">
                    <li><strong>倾向得分：</strong> 基于个体特征计算其“接受处理”的概率 P(X)。</li>
                    <li><strong>匹配：</strong> 将处理组个体与倾向得分最接近的对照组个体配对，从而控制可观测的混淆变量。</li>
                </ul>
                <div class="example">
                    <strong>📘 案例：</strong> 研究“职业培训对工资的影响”。参加培训的人可能本来就更有上进心（自选择偏差）。PSM方法：计算每个人“参加培训”的概率（基于年龄、教育、经验等），然后将参加培训的人与未参加但概率相似的“平行个体”匹配，比较两组工资差，得到更干净的因果效应。
                </div>
            `
        },
        {
            tag: 'causal',
            tagLabel: '🔬 因果推断',
            title: '断点回归 (RDD)',
            brief: '利用一个连续变量的“临界值”附近，人为构造的“准实验”来推断因果关系。',
            detail: `
                <p><strong>核心概念：</strong></p>
                <ul style="padding-left:20px; margin:6px 0;">
                    <li><strong>原理：</strong> 当个体围绕某个临界值（如高考分数线、年龄门槛）被分到不同组别时，临界值附近的两组个体在各方面几乎相同，唯一的差异是是否“跨过了线”。</li>
                    <li><strong>解读：</strong> 在断点处结果的跳跃 = 因果效应。</li>
                </ul>
                <div class="example">
                    <strong>📘 案例：</strong> 研究“上重点高中对大学升学率的影响”。以中考分数线为断点：刚好过线（进重点）的学生和刚好没过线（进普通）的学生，在能力和家庭背景上几乎一样。比较这两组学生的大学升学率差异，就是重点高中对升学的因果效应。
                </div>
            `
        },
        {
            tag: 'causal',
            tagLabel: '🔬 因果推断',
            title: '中介分析',
            brief: '探究原因X通过什么路径（中间变量M）影响结果Y。',
            detail: `
                <p><strong>核心概念：</strong></p>
                <ul style="padding-left:20px; margin:6px 0;">
                    <li><strong>直接效应：</strong> X → Y 直接作用的部分。</li>
                    <li><strong>间接效应：</strong> X → M → Y 通过中介变量作用的部分。</li>
                    <li><strong>总效应：</strong> 直接效应 + 间接效应。</li>
                </ul>
                <div class="example">
                    <strong>📘 案例：</strong> 研究“广告投放”如何影响“销售”。路径一：广告 → 品牌认知 → 销售（品牌认知是中介）。路径二：广告 → 点击 → 销售（点击是中介）。中介分析可以拆解出“广告通过提升品牌认知增加了多少销售”和“广告通过带来点击增加了多少销售”，帮助优化广告策略。
                </div>
            `
        },
        {
            tag: 'causal',
            tagLabel: '🔬 因果推断',
            title: 'DAG (有向无环图)',
            brief: '用图形化方式表达变量间的因果假设，是因果推断的“地图”。',
            detail: `
                <p><strong>核心概念：</strong></p>
                <ul style="padding-left:20px; margin:6px 0;">
                    <li><strong>节点：</strong> 变量。边（箭头）：表示因果关系（X → Y 表示 X 导致 Y）。</li>
                    <li><strong>路径：</strong> 因果信息流动的通道。</li>
                    <li><strong>阻断/控制：</strong> 在DAG中，“控制”一个变量会阻断通过它的因果路径。</li>
                </ul>
                <div class="example">
                    <strong>📘 案例：</strong> 研究“吸烟 → 肺癌”是否存在混淆。<br>
                    <p style="margin-top:6px; background:#f8faff; padding:8px 14px; border-radius:8px;">
                        <strong>DAG结构：</strong> 社会阶层 → 吸烟 → 肺癌 ← 基因<br>
                        <span style="font-size:13px; color:#4a5a6e;">解释：社会阶层影响吸烟习惯，吸烟影响肺癌；基因（如易感性）也直接导致肺癌，但不影响吸烟。<br>
                        结论：控制社会阶层，但不控制基因（基因是collider，控制它反而会引入偏差）。</span>
                    </p>
                </div>
            `
        },
        {
            tag: 'core',
            tagLabel: '⭐ 核心概念',
            title: '潜在结果框架 (Rubin因果模型)',
            brief: '因果效应 = 同一个体在“接受处理”和“不接受处理”两种状态下的结果差异。',
            detail: `
                <p><strong>核心概念：</strong></p>
                <ul style="padding-left:20px; margin:6px 0;">
                    <li><strong>潜在结果：</strong> 每个个体有两个潜在结果——Y(1)（接受处理的潜在结果）和Y(0)（未接受处理的潜在结果）。</li>
                    <li><strong>因果效应：</strong> 同一个体的 Y(1) - Y(0)。</li>
                    <li><strong>根本问题：</strong> 我们永远无法同时观察到 Y(1) 和 Y(0)，只能观察到其中一种。这就是“因果推断的根本问题”。</li>
                    <li><strong>解决方案：</strong> 通过随机化实验（RCT）或准实验方法，用群体的平均因果效应（ATE）来替代个体因果效应。</li>
                </ul>
                <div class="example">
                    <strong>📘 案例：</strong> 小明服了感冒药后3天康复。但问题是——如果小明没有服药，他会不会也在3天康复？我们永远不知道（因为没有平行时空）。所以我们只能通过比较大规模实验中药组和安慰剂组的平均康复天数，来推断药物的平均因果效应。
                </div>
            `
        }
    ];

    // ============================================================
    // 渲染逻辑
    // ============================================================
    const grid = document.getElementById('cardGrid');
    let currentFilter = 'all';
    let searchQuery = '';

    function renderCards(filter, query) {
        const q = query.toLowerCase().trim();
        let filtered = cardsData;

        if (filter !== 'all') {
            filtered = filtered.filter(c => c.tag === filter);
        }
        if (q) {
            filtered = filtered.filter(c => {
                const text = c.title + ' ' + c.brief + ' ' + c.detail;
                return text.toLowerCase().includes(q);
            });
        }

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="no-result" style="display:block;">😅 没有找到匹配的概念，试试其他关键词吧</div>`;
            return;
        }

        let html = '';
        filtered.forEach((card, idx) => {
            const id = `card-${idx}`;
            const tagClass = card.tag === 'stat' ? 'stat' : card.tag === 'causal' ? 'causal' : 'core';
            html += `
                <div class="card" id="${id}" data-tag="${card.tag}">
                    <span class="tag ${tagClass}">${card.tagLabel}</span>
                    <div class="title">${card.title}</div>
                    <div class="brief">${card.brief}</div>
                    <div class="expand-hint">🔽 点击展开详情</div>
                    <div class="detail">${card.detail}</div>
                </div>
            `;
        });

        grid.innerHTML = html;

        // ---- 点击卡片展开/收起 ----
        document.querySelectorAll('.card').forEach(el => {
            el.addEventListener('click', function(e) {
                // 如果点击的是详情区域内的链接或按钮，不触发折叠
                if (e.target.closest('a')) return;
                this.classList.toggle('open');
                const hint = this.querySelector('.expand-hint');
                if (hint) {
                    hint.textContent = this.classList.contains('open') ? '🔼 点击收起' : '🔽 点击展开详情';
                }
            });
        });
    }

    // ---- 搜索 ----
    document.getElementById('searchInput').addEventListener('input', function() {
        searchQuery = this.value;
        renderCards(currentFilter, searchQuery);
    });

    // ---- 过滤 ----
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            renderCards(currentFilter, searchQuery);
        });
    });

    // ---- 初始化 ----
    renderCards('all', '');
</script>
</body>
</html>
