<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>42天月子每日操作与饮食 Checklist</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
            background: #f8f6f9;
            color: #2d2a2c;
            padding: 24px 16px 40px;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            padding: 24px 20px 32px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 3px solid #f0e8f0;
            padding-bottom: 16px;
            margin-bottom: 18px;
        }
        h1 small {
            font-size: 15px;
            font-weight: 400;
            color: #7a6a7a;
            margin-left: auto;
        }
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 22px;
            background: #f8f3f8;
            padding: 12px 16px;
            border-radius: 18px;
        }
        .progress-track {
            flex: 1;
            height: 10px;
            background: #e5d8e5;
            border-radius: 99px;
            overflow: hidden;
            min-width: 100px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #c9b0c9, #a88aa8);
            border-radius: 99px;
            transition: width 0.3s ease;
        }
        .stats {
            font-size: 14px;
            font-weight: 500;
            color: #4d3a4d;
            white-space: nowrap;
        }

        /* 每天折叠卡片 */
        .day-card {
            border: 1px solid #ece4ec;
            border-radius: 16px;
            margin-bottom: 12px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .day-card:hover {
            border-color: #d6c8d6;
        }
        .day-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #fcfafc;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .day-header:hover {
            background: #f6f0f6;
        }
        .day-header .day-num {
            font-weight: 700;
            font-size: 16px;
            color: #3f2e3f;
            min-width: 70px;
        }
        .day-header .day-status {
            font-size: 13px;
            color: #7a6a7a;
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .day-header .arrow {
            transition: transform 0.25s;
            font-size: 14px;
            color: #9a8a9a;
        }
        .day-card.open .arrow {
            transform: rotate(180deg);
        }
        .day-body {
            display: none;
            padding: 0 16px 18px 16px;
            background: #fefcfe;
        }
        .day-card.open .day-body {
            display: block;
        }

        .section-title {
            font-weight: 600;
            font-size: 15px;
            color: #4d3a4d;
            margin: 14px 0 8px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .badge {
            font-size: 12px;
            background: #ece4ec;
            padding: 0 10px;
            border-radius: 30px;
            color: #5f4a5f;
            font-weight: 500;
        }
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-left: 4px;
        }
        .item-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 4px 6px 4px 4px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.12s;
        }
        .item-row:hover {
            background: #f6f0f6;
        }
        .item-row input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }
        .custom-check {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            margin-top: 2px;
            border-radius: 6px;
            border: 2px solid #cfbccf;
            background: #fcf9fc;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .item-row input:checked+.custom-check {
            background: #a88aa8;
            border-color: #a88aa8;
        }
        .item-row input:checked+.custom-check::after {
            content: "✓";
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            line-height: 1;
        }
        .item-text {
            font-size: 14px;
            line-height: 1.5;
            color: #2d2a2c;
            transition: color 0.2s, text-decoration 0.2s;
        }
        .item-row input:checked~.item-text {
            color: #b0a0b0;
            text-decoration: line-through;
            text-decoration-color: #d4c0d4;
        }
        .food-tip {
            background: #f8f3f8;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            color: #3f2e3f;
            border-left: 3px solid #c9b0c9;
            margin: 6px 0 4px 0;
        }

        .reset-btn {
            background: transparent;
            border: 1.5px solid #dcc8dc;
            color: #7a5a7a;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
            font-family: inherit;
        }
        .reset-btn:hover {
            background: #f2e8f2;
            border-color: #c9b0c9;
        }

        @media (max-width: 480px) {
            .container {
                padding: 16px 12px;
            }
            .day-header {
                padding: 12px 12px;
                flex-wrap: wrap;
            }
            .day-header .day-num {
                font-size: 14px;
                min-width: 60px;
            }
            .day-body {
                padding: 0 12px 14px 12px;
            }
            .item-text {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1>
        🗓️ 42天月子每日Checklist
        <small>操作 + 饮食</small>
    </h1>
    <div class="progress-wrap">
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="stats" id="statsText">0 / 0</div>
    </div>

    <div id="dayContainer"></div>

    <div style="text-align: center; margin-top: 6px;">
        <button class="reset-btn" id="resetBtn">↻ 重置所有勾选</button>
    </div>
    <p style="font-size: 13px; color: #9a8a9a; text-align: center; margin-top: 18px;">💡 点击每天卡片展开/收起 · 勾选即完成</p>
</div>

<script>
    (function() {
        // ============================================================

        // ============================================================
        const DAYS = [];

        // ---- 第1天 ----
        DAYS.push({

                '产后2-3小时喂母乳（或吸奶器低档刺激）',
                '顺产6-12h下床活动；剖腹产12h后可下床，勿久站久蹲',
                '用热水浸湿毛巾，每2h清洁恶露',
                '观察出血量，异常及时告知医生'
            ],
            diet: '红糖小米粥、薏米红枣百合汤、牛奶红枣粥、青菜鸡蛋面（剖腹产排气后）'
        });

        // ---- 第2天 ----
        DAYS.push({
            day: 2,
            label: '分娩第2天 · 初乳喂养',
            ops: [
                '疼痛减轻，避免过度活动',
                '给宝宝吃初乳（金黄色，含丰富免疫物质）',
                '学习正确含乳姿势，避免乳头皲裂',
                '3-4小时排尿一次，多喝温水',
                '自己处理恶露，勤换卫生用品',
                '顺产做会阴收缩运动（凯格尔）',
                '少食多餐，3正餐+3加餐',
                '剖腹产排气后喝稀粥、汤面等半流质',
                '用软毛牙刷温水刷牙',
                '副乳肿胀可边喂奶边轻揉'
            ],
            diet: '少食多餐，参考42天月子餐食谱；剖腹产排气后清淡半流质'
        });

        // ---- 第3天 ----
        DAYS.push({
            day: 3,
            label: '分娩第3天 · 生理性涨奶',
            ops: [
                '生理性涨奶，坚持母乳+毛巾冷敷缓解',
                '自然分娩可出院，在家坚持排恶露',
                '每天喂奶8次以上，促进泌乳和子宫收缩',
                '出院前办好出生证明、医保报销，保管好资料',
                '用热毛巾擦身，多备纯棉月子服',
                '多喝水+膳食纤维，预防便秘痔疮',
                '戴哺乳内衣，支撑乳房防乳腺炎',
                '侧卧哺乳适合剖腹产和侧切宝妈',
                '产后3-6天乳房充血涨奶，让宝宝频繁吸吮或用吸奶器排出',
                '产后一周不宜喝荤汤催乳，1-2周后方可喝下奶汤',
                '第3天未排便要多喝水、吃稀饭面条及富含膳食纤维食物'
            ],
            diet: '多喝水、稀饭、面条、膳食纤维；产后一周不喝荤汤催乳'
        });

        // ---- 第4天 ----
        DAYS.push({
            day: 4,
            label: '分娩第4天 · 慢慢恢复',
            ops: [
                '保持室温不冷不热',
                '不要过度做家务或长时间抱孩子',
                '会阴缝合处未恢复，排便勿用力',
                '出冷汗勤换衣服，穿袜子，戴透气的帽子',
                '想洗头可擦澡，让家人帮忙洗头并及时吹干'
            ],
            diet: '正常饮食，注意营养均衡'
        });

        // ---- 第5天 ----
        DAYS.push({
            day: 5,
            label: '分娩第5天 · 情绪与恢复',
            ops: [
                '多吃含蛋白质和铁丰富的食物',
                '子宫缩小至拳头大小，褐色恶露减少',
                '多和家人聊天、听音乐，预防产后抑郁',
                '剖腹产多躺多休息，伤口未愈合行动不便',
                '产后心理减压：多吃水果蔬菜，少吃多餐，适量走动',
                '宝宝奶量约60ml，每天8次（母乳按需）'
            ],
            diet: '含蛋白质和铁丰富的食物（参考42天食谱）'
        });

        // ---- 第6天 ----
        DAYS.push({
            day: 6,
            label: '分娩第6天 · 补铁补钙',
            ops: [
                '继续服用补铁、补钙，帮助身体恢复',
                '保持充足睡眠（每天8-10小时），有助于乳汁分泌',
                '向有经验的人请教照顾孩子要领',
                '会阴侧切宝妈缝合部位基本痊愈',
                '尽量少看手机，半躺着+开灯看',
                '不要做家务，不要碰凉水',
                '宝宝每2-3小时吃奶一次，新生儿每天睡15小时'
            ],
            diet: '补铁补钙，均衡营养'
        });

        // ---- 第7天 ----
        DAYS.push({
            day: 7,
            label: '分娩第7天 · 逐渐适应',
            ops: [
                '自然分娩身体好转但仍需静养；剖腹产伤口开始愈合',
                '可换尿布、简单看护，勿长时间抱孩子或弯腰',
                '掌握哺乳量和节奏，逐渐形成睡眠和吃奶规律',
                '开始做腹式呼吸（每天10次左右），帮助腹部恢复',
                '注意眼睛保养，少用眼，多闭目养神',
                '白天补觉，保证休息',
                '确认恶露量和颜色是否正常'
            ],
            diet: '正常饮食，避免油腻'
        });

        // ---- 第2周（第8-14天） ----
        DAYS.push({
            day: '2W',
            label: '分娩第2周 · 淋浴与通乳',
            ops: [
                '可逐渐摄入营养丰富食物，但不要太油腻防堵奶',
                '可淋浴（5-10分钟），剖腹产伤口防水，洗后擦干涂保湿乳',
                '产后1个月内只用淋浴，不用盆浴',
                '坚持做产褥期体操，帮助恢复',
                '保证随时可休息，房间常铺好被褥',
                '奶水不足可能是睡眠不足导致',
                '会阴愈合，恶露量减少',
                '正常恶露有血腥味无臭味，异常需就医',
                '产后第二周是泌乳高峰期，使用防溢乳垫',
                '定时排便（早起后排便）',
                '小心产后痔疮，多喝水+适当运动+预防便秘食物',
                '哺乳期间不吃回奶食物（韭菜、麦芽等）',
                '橘络、通草有通乳作用，第三周开始重点通乳催乳'
            ],
            diet: '营养丰富但不油腻；不吃韭菜、麦芽等回奶食物；可吃橘络、通草'
        });

        // ---- 第3周（第15-21天） ----
        DAYS.push({
            day: '3W',
            label: '分娩第3周 · 催乳与塑身',
            ops: [
                '可换尿布，但洗澡等消耗大体力的活儿由家人代劳',
                '多躺多坐少站少劳累，注意护腰',
                '可使用孕妇塑身衣，预防腹部肌肉下垂',
                '只做基础皮肤护理',
                '多摄取高铁、高蛋白食物，保证母乳',
                '疲劳时恶露会再次增加，需多注意',
                '了解宝宝睡眠周期，和宝宝一起睡保证休息',
                '循序渐近补充催乳食物（五红汤、鲫鱼、猪蹄、通草等），但不必每餐大鱼大肉'
            ],
            diet: '高铁高蛋白；开始催乳食物（五红汤、鲫鱼、猪蹄、通草）'
        });

        // ---- 第4周（第22-28天） ----
        DAYS.push({
            day: '4W',
            label: '分娩第4周 · 情绪与满月照',
            ops: [
                '调节情绪，避免焦虑加重脱发',
                '多吃维生素C（西兰花、西红柿、石榴等）',
                '剖腹产坚持涂疤痕护理药膏',
                '本周恶露变为乳白色',
                '及时处理恶露，给会阴消毒（尤其侧切）',
                '提前准备满月照道具',
                '体重管理提上日程，下周开始简单运动',
                '产后初月经（未哺乳会来，哺乳会延迟）',
                '和宝宝一起去医院定期检查'
            ],
            diet: '多吃含维生素C的食物（西兰花、西红柿、石榴）'
        });

        // ---- 第5周（第29-35天） ----
        DAYS.push({
            day: '5W',
            label: '分娩第5周 · 运动与修复',
            ops: [
                '恢复快可过性生活，需多注意',
                '异常及时去医院',
                '经常按摩、做面膜，改善皮肤',
                '可照顾孩子，做简单家务（量力而行）',
                '正式开始调节饮食，坚持产后体操',
                '坚持适度的运动（凯格尔运动+腹式呼吸）',
                '每天1-2次尿训练，预防尿频',
                '谨防腰背酸痛：背部运动操（仰卧抱膝）',
                '补血依然重要，多吃含铁食物'
            ],
            diet: '调节饮食，多吃含铁食物（肉类、动物内脏、动物血、红枣、花生、黑芝麻等）'
        });

        // ---- 第6周（第36-42天） ----
        DAYS.push({
            day: '6W',
            label: '分娩第6周 · 42天产检',
            ops: [
                '做好避孕（即使没来月经也可能排卵）',
                '记得做42天产检，同时带宝宝打疫苗',
                '产后6周开始有氧运动（散步、慢跑等），从15分钟逐渐增加',
                '锻炼盆底肌肉，预防阴道松弛',
                '可开车，也可短途旅行缓解压力',
                '第6周是身体恢复重要周期，宝宝生长迅速，宝妈需补充充足营养',
                '42天月子结束，但仍需吃得有营养，不要太劳累'
            ],
            diet: '充足营养，保证身体恢复'
        });

        // ============================================================
        // 渲染逻辑
        // ============================================================
        const STORAGE_KEY = 'yuezi_checklist_42d_v1';

        // 生成所有item id
        function getAllItemIds() {
            const ids = [];
            DAYS.forEach((d, di) => {
                if (d.ops) {
                    d.ops.forEach((_, oi) => {
                        ids.push(`d${di}-op${oi}`);
                    });
                }
                if (d.diet) {
                    ids.push(`d${di}-diet`);
                }
            });
            return ids;
        }

        function getDefaultState() {
            const s = {};
            getAllItemIds().forEach(id => { s[id] = false; });
            return s;
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const valid = new Set(getAllItemIds());
                    const cleaned = {};
                    for (const [k, v] of Object.entries(parsed)) {
                        if (valid.has(k)) cleaned[k] = !!v;
                    }
                    const def = getDefaultState();
                    for (const id of valid) {
                        if (!(id in cleaned)) cleaned[id] = def[id];
                    }
                    return cleaned;
                }
            } catch (_) {}
            return getDefaultState();
        }

        function saveState(s) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
            } catch (_) {}
        }

        const state = loadState();
        const container = document.getElementById('dayContainer');
        const progressFill = document.getElementById('progressFill');
        const statsText = document.getElementById('statsText');

        function render() {
            let totalItems = 0;
            let doneItems = 0;

            // 先统计总数
            DAYS.forEach((d, di) => {
                if (d.ops) totalItems += d.ops.length;
                if (d.diet) totalItems += 1;
            });

            // 统计已完成
            for (const id of Object.keys(state)) {
                if (state[id]) doneItems++;
            }

            // 更新进度
            const pct = totalItems === 0 ? 0 : Math.round((doneItems / totalItems) * 100);
            progressFill.style.width = pct + '%';
            statsText.textContent = doneItems + ' / ' + totalItems;

            // 渲染卡片
            let html = '';
            DAYS.forEach((d, di) => {
                const dayKey = `d${di}`;
                const isOpen = (di === 0 || di === 1 || di === 2) ? true : false; // 默认展开前3天
                let opDone = 0;
                let opTotal = 0;
                if (d.ops) {
                    d.ops.forEach((_, oi) => {
                        const id = `${dayKey}-op${oi}`;
                        if (state[id]) opDone++;
                        opTotal++;
                    });
                }
                let dietDone = 0;
                let dietTotal = 0;
                if (d.diet) {
                    const id = `${dayKey}-diet`;
                    if (state[id]) dietDone++;
                    dietTotal = 1;
                }
                const subDone = opDone + dietDone;
                const subTotal = opTotal + dietTotal;
                const subPct = subTotal === 0 ? 0 : Math.round((subDone / subTotal) * 100);
                const statusText = subTotal === 0 ? '' : `${subDone}/${subTotal}`;

                html += `<div class="day-card ${isOpen ? 'open' : ''}" data-day="${dayKey}">`;
                html += `<div class="day-header" data-toggle="${dayKey}">`;
                html += `<span class="day-num">${d.day} · ${d.label}</span>`;
                html += `<span class="day-status">${statusText} <span class="arrow">▼</span></span>`;
                html += `</div>`;
                html += `<div class="day-body">`;

                // 操作列表
                if (d.ops && d.ops.length > 0) {
                    html += `<div class="section-title">📋 今日操作 <span class="badge">${opDone}/${opTotal}</span></div>`;
                    html += `<div class="item-list">`;
                    d.ops.forEach((text, oi) => {
                        const id = `${dayKey}-op${oi}`;
                        const checked = state[id] || false;
                        html += `<label class="item-row">`;
                        html += `<input type="checkbox" ${checked ? 'checked' : ''} data-id="${id}">`;
                        html += `<span class="custom-check"></span>`;
                        html += `<span class="item-text">${text}</span>`;
                        html += `</label>`;
                    });
                    html += `</div>`;
                }

                // 饮食
                if (d.diet) {
                    const id = `${dayKey}-diet`;
                    const checked = state[id] || false;
                    html += `<div class="section-title">🍽️ 饮食建议 <span class="badge">${dietDone}/${dietTotal}</span></div>`;
                    html += `<label class="item-row">`;
                    html += `<input type="checkbox" ${checked ? 'checked' : ''} data-id="${id}">`;
                    html += `<span class="custom-check"></span>`;
                    html += `<span class="item-text">${d.diet}</span>`;
                    html += `</label>`;
                }

                html += `</div>`; // day-body
                html += `</div>`; // day-card
            });

            container.innerHTML = html;

            // ---- 事件绑定 ----
            // 1. checkbox
            document.querySelectorAll('.item-row input[type="checkbox"]').forEach(inp => {
                inp.addEventListener('change', function(e) {
                    const id = this.dataset.id;
                    state[id] = this.checked;
                    saveState(state);
                    render();
                });
            });

            // 2. 折叠展开
            document.querySelectorAll('.day-header[data-toggle]').forEach(header => {
                header.addEventListener('click', function() {
                    const card = this.closest('.day-card');
                    if (card) {
                        card.classList.toggle('open');
                    }
                });
            });
        }

        // 重置
        document.getElementById('resetBtn').addEventListener('click', function() {
            if (confirm('确定要清除所有勾选状态吗？')) {
                const def = getDefaultState();
                for (const k of Object.keys(state)) {
                    state[k] = def[k] || false;
                }
                saveState(state);
                render();
            }
        });

        render();
    })();
</script>
</body>
</html>
